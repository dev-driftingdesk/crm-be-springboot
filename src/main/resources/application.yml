server:
  port: 8084
  servlet:
    context-path: /api/v1

spring:
  application:
    name: crmbuild-service

  # Enable ANSI colors in console output
  output:
    ansi:
      enabled: ALWAYS

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/crmbuild}
      auto-index-creation: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/lahiru
          jwk-set-uri: http://localhost:8080/realms/lahiru/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            client-id: lahiru
            client-secret: ${KEYCLOAK_CLIENT_SECRET:xEIeFp4ishQlspp2YLtQGn7InVI5t2Qi}
            authorization-grant-type: authorization_code
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/lahiru
            user-name-attribute: preferred_username
  
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Twilio Configuration
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}

# Meta Ads Configuration
meta:
  app-id: ${META_APP_ID:}
  app-secret: ${META_APP_SECRET:}
  access-token: ${META_ACCESS_TOKEN:}

# Google Ads Configuration
google:
  ads:
    client-id: ${GOOGLE_ADS_CLIENT_ID:}
    client-secret: ${GOOGLE_ADS_CLIENT_SECRET:}
    developer-token: ${GOOGLE_ADS_DEVELOPER_TOKEN:}

# Deepgram Configuration
deepgram:
  api-key: ${DEEPGRAM_API_KEY:}

logging:
  level:
    com.ceedpods.crmbuild: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.mongodb: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always