server:
  port: 8084
  servlet:
    context-path: /api/v1

spring:
  application:
    name: crmbuild-service

  # Enable ANSI colors in console output
  output:
    ansi:
      enabled: ALWAYS

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://amithrathnayaka34_db_user:ceedpods1997@ceedpods.dszv2xr.mongodb.net/ceedpods?retryWrites=true&w=majority&appName=ceedpods}
      auto-index-creation: true

  # Email Configuration (Spring Mail)
  # Using Ceedpods mail server with SSL/TLS
  mail:
    host: ${SMTP_HOST:mail.ceedpods.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:noreply@ceedpods.com}
    password: ${SMTP_PASSWORD:kA_M=H-NKaEpyasp}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            required: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    test-connection: false

  # OAuth2 configuration - Keycloak required
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:${keycloak.server-url}/realms/${keycloak.realm-name}}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${keycloak.server-url}/realms/${keycloak.realm-name}/protocol/openid-connect/certs}
  


# Keycloak Configuration - Required for application startup
keycloak:
  # Server Configuration
  server-url: ${KEYCLOAK_SERVER_URL:https://ceedpods-keycloak.wittycliff-5b88c7b4.westus2.azurecontainerapps.io}
  realm-name: ${KEYCLOAK_REALM_NAME:ceedpods}
  
  # Client Configuration
  client-id: ${KEYCLOAK_CLIENT_ID:ceedpods}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:TVdDpeJHPl2uegRlIhlXL7TCuVdYoirR}
  
  # Admin Configuration (for realm management)
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
  
  # Connection Settings
  connection:
    timeout: ${KEYCLOAK_CONNECTION_TIMEOUT:5000}

# Twilio Configuration
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}

# Meta Ads Configuration
meta:
  app-id: ${META_APP_ID:}
  app-secret: ${META_APP_SECRET:}
  access-token: ${META_ACCESS_TOKEN:}

# Google Ads Configuration
google:
  ads:
    client-id: ${GOOGLE_ADS_CLIENT_ID:}
    client-secret: ${GOOGLE_ADS_CLIENT_SECRET:}
    developer-token: ${GOOGLE_ADS_DEVELOPER_TOKEN:}

# Deepgram Configuration
deepgram:
  api-key: ${DEEPGRAM_API_KEY:}

# Application Configuration
app:
  url: ${APP_URL:http://localhost:8084}
  email:
    enabled: ${EMAIL_ENABLED:true}
    from: ${EMAIL_FROM:noreply@ceedpods.com}
    from-name: ${EMAIL_FROM_NAME:Ceedpods CRM}
  password-reset:
    token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:15}
    rate-limit:
      max-requests-per-hour: ${PASSWORD_RESET_MAX_REQUESTS_PER_HOUR:5}
      min-minutes-between-requests: ${PASSWORD_RESET_MIN_MINUTES_BETWEEN_REQUESTS:2}
  encryption:
    secret: ${ENCRYPTION_SECRET:my-secret-key-change-in-production}

logging:
  level:
    com.ceedpods.crmbuild: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.client: DEBUG
    org.mongodb: WARN
    org.springframework.data.mongodb: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always