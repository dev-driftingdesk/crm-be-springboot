server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: crmbuild-service
  
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=crmbuild;encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
  
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  
  security:
    jwt:
      secret: ${JWT_SECRET:mySecretKey}
      expiration: 86400000 # 24 hours
  
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Twilio Configuration
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}

# Meta Ads Configuration
meta:
  app-id: ${META_APP_ID:}
  app-secret: ${META_APP_SECRET:}
  access-token: ${META_ACCESS_TOKEN:}

# Google Ads Configuration
google:
  ads:
    client-id: ${GOOGLE_ADS_CLIENT_ID:}
    client-secret: ${GOOGLE_ADS_CLIENT_SECRET:}
    developer-token: ${GOOGLE_ADS_DEVELOPER_TOKEN:}

# Deepgram Configuration
deepgram:
  api-key: ${DEEPGRAM_API_KEY:}

logging:
  level:
    com.ceedpods.crmbuild: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/crmbuild-service.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always